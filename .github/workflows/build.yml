name: Сборка GeOS

on:
  workflow_dispatch:      # кнопка «Run workflow» во вкладке Actions
  push:
    tags: ['v*']          # или автоматически при теге v1.0, v1.1...

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Освободить место на диске
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Собрать ISO внутри Debian
        run: |
          sudo docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash -c '
            set -e -o pipefail
            apt-get update && apt-get install -y sudo
            chmod +x build.sh overlay/hooks/live/* overlay/includes.chroot/usr/local/bin/* overlay/includes.chroot/usr/local/sbin/*
            # В файлы — только предупреждения и последние строки (полный лог может быть огромным)
            ./build.sh 2>&1 | tee >(grep -a --line-buffered "ВНИМАНИЕ" > /work/warnings.log) \
                                  >(tail -n 300 > /work/build-tail.log)
          '

      - name: Отчёт проверки GeOS
        if: always()
        run: |
          # Отчёт и предупреждения выводятся на странице сборки (раздел Annotations)
          esc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
          f=build/chroot/usr/share/geos/build-report.txt
          if sudo test -f "$f"; then
            sudo cat "$f"
            echo "::notice title=ПРОВЕРКА GeOS::$(sudo cat "$f" | esc)"
          else
            echo "::warning title=ПРОВЕРКА GeOS::Отчёт не создан — сборка остановилась раньше"
          fi
          if [ -s warnings.log ]; then
            echo "::warning title=Предупреждения сборки::$(sort -u warnings.log | head -40 | esc)"
          fi
          if ! ls build/*.iso >/dev/null 2>&1 && [ -f build-tail.log ]; then
            echo "::error title=Последние строки лога::$(uniq -c build-tail.log | tail -40 | esc)"
          fi
          true

      - name: Выложить ISO для скачивания
        uses: actions/upload-artifact@v4
        with:
          name: GeOS-iso
          path: build/*.iso
          compression-level: 0
          retention-days: 7
