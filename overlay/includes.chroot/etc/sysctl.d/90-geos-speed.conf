# GeOS: настройки отзывчивости (по мотивам CachyOS)
# Память: активнее использовать сжатый zram и дольше держать в кэше нужные файлы
vm.swappiness = 100
vm.page-cluster = 0
vm.vfs_cache_pressure = 50
# Запись на диск небольшими порциями — без подвисаний при копировании больших файлов
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
# Игры (Steam, Proton): больше областей памяти, без замедления «split lock»
vm.max_map_count = 2147483642
kernel.split_lock_mitigate = 0
# Без лишнего сторожевого таймера — меньше прерываний
kernel.nmi_watchdog = 0
# Быстрый интернет: современный алгоритм BBR
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
