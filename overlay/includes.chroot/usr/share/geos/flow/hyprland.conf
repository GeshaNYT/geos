# ============================================================
#  GeOS Flow — плиточный режим GeOS с плавными анимациями
#  Свои настройки: скопируй этот файл в ~/.config/hypr/hyprland.conf —
#  тогда GeOS Flow будет использовать твою копию.
# ============================================================

$flow = /usr/share/geos/flow
$menu = fuzzel --config $flow/fuzzel.ini
$term = konsole
$files = dolphin

monitor = , preferred, auto, 1

# ---------- Окружение: Qt и GTK в стиле GeOS ----------
env = XCURSOR_THEME, breeze_cursors
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORM, wayland;xcb
env = QT_QPA_PLATFORMTHEME, kde
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = GDK_BACKEND, wayland,x11
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland

# ---------- Автозапуск ----------
exec-once = dbus-update-activation-environment --systemd --all
exec-once = swaybg -m fill -i /usr/share/wallpapers/GeOS/contents/images/3840x2160.png
exec-once = /usr/local/bin/geos-flow-bar
exec-once = mako --config $flow/mako.conf
exec-once = hypridle -c $flow/hypridle.conf
exec-once = /usr/lib/x86_64-linux-gnu/libexec/polkit-kde-authentication-agent-1
exec-once = /usr/lib/x86_64-linux-gnu/libexec/kdeconnectd
exec-once = wl-paste --watch cliphist store
exec-once = /usr/local/bin/geos-visualizer
exec-once = /usr/local/bin/geos-flow-kb
exec-once = /usr/local/bin/geos-flow-welcome

# ---------- Ввод ----------
input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}
gesture = 3, horizontal, workspace

# ---------- Внешний вид ----------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(3b82f6ff) rgba(38bdf8ff) 45deg
    col.inactive_border = rgba(1e3a6eaa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    # Стекло: окна полупрозрачные, за ними размытые обои (Win+O — включить/выключить)
    active_opacity = 0.94
    inactive_opacity = 0.86
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 7
        passes = 3
        vibrancy = 0.2
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(07112aee)
    }
}

# ---------- Анимации ----------
animations {
    enabled = true
    bezier = geos, 0.05, 0.9, 0.1, 1.05
    bezier = soft, 0.25, 1, 0.5, 1
    animation = windows, 1, 6, geos, popin 80%
    animation = windowsOut, 1, 5, soft, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 80, default, loop
    animation = fade, 1, 6, soft
    animation = workspaces, 1, 6, geos, slide
    animation = layers, 1, 5, soft, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x0d1b34
    animate_manual_resizes = true
}

# ---------- Клавиши (Win = SUPER) ----------
$mod = SUPER

# Меню «Пуск» по нажатию Win, как в Windows
bindr = $mod, SUPER_L, exec, pkill fuzzel || $menu
bind = $mod, R, exec, $menu
bind = $mod, Return, exec, $term
bind = $mod, E, exec, $files
bind = $mod, I, exec, systemsettings
bind = $mod, B, exec, firefox-esr
bind = $mod, G, exec, geos-center
bind = CTRL SHIFT, Escape, exec, plasma-systemmonitor
bind = $mod, F1, exec, /usr/local/bin/geos-flow-keys
bind = $mod, V, exec, cliphist list | $menu --dmenu --prompt "📋 ❯ " | cliphist decode | wl-copy
bind = $mod, L, exec, hyprlock -c $flow/hyprlock.conf
bind = $mod, X, exec, /usr/local/bin/geos-flow-power
bind = $mod, Space, exec, hyprctl switchxkblayout all next
bind = $mod, O, exec, /usr/local/bin/geos-flow-glass

# Снимки экрана
bind = $mod SHIFT, S, exec, /usr/local/bin/geos-flow-screenshot area
bind = , Print, exec, /usr/local/bin/geos-flow-screenshot screen

# Окна
bind = $mod, Q, killactive,
bind = ALT, F4, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, M, fullscreen, 1
bind = $mod, T, togglefloating,
bind = $mod, P, pseudo,
bind = $mod, J, togglesplit,
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d
bind = ALT, Tab, cyclenext,
bind = ALT, Tab, bringactivetotop,
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Рабочие столы 1–9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, Tab, workspace, e+1
bind = $mod SHIFT, Tab, workspace, e-1
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Громкость, яркость, музыка
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
