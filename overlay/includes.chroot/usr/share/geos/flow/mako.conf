# Уведомления GeOS Flow
font=Inter 11
background-color=#0d1b34ee
text-color=#e6eefa
border-color=#2563eb
border-size=2
border-radius=14
padding=14
margin=12
width=380
icons=1
max-icon-size=48
icon-path=/usr/share/icons/breeze-dark
default-timeout=6000
anchor=top-right

