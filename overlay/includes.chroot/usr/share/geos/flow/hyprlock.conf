# Экран блокировки GeOS Flow
general {
    hide_cursor = true
}

background {
    path = /usr/share/wallpapers/GeOS/contents/images/3840x2160.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
}

label {
    text = $TIME
    color = rgba(230, 238, 250, 1.0)
    font_size = 96
    font_family = Inter
    position = 0, 160
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(150, 170, 200, 1.0)
    font_size = 20
    font_family = Inter
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    size = 320, 54
    rounding = 14
    outline_thickness = 2
    outer_color = rgba(59, 130, 246, 0.9)
    inner_color = rgba(13, 27, 52, 0.85)
    font_color = rgba(230, 238, 250, 1.0)
    check_color = rgba(56, 189, 248, 1.0)
    fail_color = rgba(248, 113, 113, 1.0)
    placeholder_text = 🔒
    fail_text = ✖
    dots_center = true
    fade_on_empty = false
    position = 0, -40
    halign = center
    valign = center
}
