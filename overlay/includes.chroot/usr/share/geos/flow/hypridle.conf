# Сон и блокировка GeOS Flow
general {
    # в пробном режиме (с флешки) не блокируем: пароль там никто не задавал
    lock_cmd = grep -q boot=live /proc/cmdline || pidof hyprlock || hyprlock -c /usr/share/geos/flow/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 10 минут без действий — блокировка
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 12 минут — выключить экран
listener {
    timeout = 720
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
